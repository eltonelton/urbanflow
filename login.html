<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Entrar | UrbanFlow</title>

<meta
name="description"
content="Acesse o UrbanFlow e acompanhe linhas de ônibus e rotas urbanas.">

<link
rel="stylesheet"
href="css/style.css">

</head>

<body class="login-body">

<div class="login-card">

    <h1>UrbanFlow</h1>

    <p>
        Seu trajeto mais simples.
    </p>

    <form id="loginForm">

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
            maxlength="30"
            required
            aria-label="Nome do usuário">

        <button type="submit">

            Entrar

        </button>

    </form>

    <div
    style="
    margin-top:20px;
    font-size:14px;
    color:#666;">

        Ao continuar você concorda com nossos

        <a href="terms.html">

            Termos

        </a>

        e

        <a href="privacy.html">

            Política de Privacidade

        </a>

    </div>

</div>

<!-- Banner de cookies -->

<div
id="cookieBanner"
style="
position:fixed;
bottom:20px;
left:20px;
right:20px;
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
display:none;
z-index:999;
">

    Este site utiliza armazenamento local
    para salvar preferências do usuário.

    <button
    id="acceptCookies"
    style="
    margin-left:10px;
    padding:8px 15px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:10px;
    cursor:pointer;
    ">
        Entendi
    </button>

</div>

<script src="js/auth.js"></script>

</body>

</html>
