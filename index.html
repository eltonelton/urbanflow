<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>UrbanFlow</title>

<meta
name="description"
content="Sistema de mobilidade urbana inteligente.">

<link
rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">

            UrbanFlow

        </div>

        <nav class="nav-links">

            <a href="index.html">

                Início

            </a>

            <a href="onibus.html">

                Ônibus

            </a>

            <a href="mapa.html">

                Mapa

            </a>

            <a href="sobre.html">

                Sobre

            </a>

        </nav>

        <br>

        <button
        id="themeToggle"
        class="button">

            Alternar Tema

        </button>

        <br>

        <button
        id="logoutBtn"
        class="button">

            Sair

        </button>

    </aside>

    <main class="content">

        <section class="hero">

            <h1 id="welcomeUser">

                Bem-vindo

            </h1>

            <p>

                Consulte linhas,
                horários e rotas
                de forma rápida
                e intuitiva.

            </p>

        </section>

        <section class="bento-grid">

            <div class="card">

                <h3>

                    Linhas Ativas

                </h3>

                <div class="big-number">

                    104

                </div>

            </div>

            <div class="card">

                <h3>

                    Ônibus em Operação

                </h3>

                <div class="big-number">

                    58

                </div>

            </div>

            <div class="card">

                <h3>

                    Rotas Monitoradas

                </h3>

                <div class="big-number">

                    27

                </div>

            </div>

            <div class="card">

                <h3>

                    Taxa Média de Ocupação

                </h3>

                <div class="big-number">

                    73%

                </div>

            </div>

        </section>

        <div class="footer">

            UrbanFlow • Projeto UX/UI

        </div>

    </main>

</div>

<script src="js/app.js"></script>

<script src="js/theme.js"></script>

</body>

</html>
