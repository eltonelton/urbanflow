<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linhas | UrbanFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
<header class="sidebar">
  <a class="logo" href="index.html" aria-label="UrbanFlow — página inicial">
    UrbanFlow
  </a>

  <nav class="nav-links" aria-label="Navegação principal">
    <a href="index.html">Início</a>
    <a href="onibus.html">Ônibus</a>
    <a href="mapa.html">Mapa</a>
    <a href="sobre.html">Sobre</a>
  </nav>

  <div class="navbar-actions">
    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
      aria-label="Ativar tema escuro"
      title="Ativar tema escuro">
      <span id="themeIcon" aria-hidden="true">☾</span>
    </button>

    <button
      id="logoutBtn"
      class="logout-button"
      type="button">
      Sair
    </button>
  </div>
</header>

    <main class="content">
      <section class="hero">
        <p class="eyebrow">Consulta de linhas</p>
        <h1>Linhas disponíveis</h1>
        <p>Pesquise por uma linha, destino ou bairro para consultar horários e vagas.</p>
      </section>

      <div class="search-box">
        <input
          type="search"
          id="busSearch"
          placeholder="Pesquisar linha ou rota..."
          aria-label="Pesquisar linha ou rota">
      </div>

      <div id="busContainer" aria-live="polite"></div>

      <footer class="footer">
        <p>© 2026 UrbanFlow. Todos os direitos reservados.</p>
        <nav class="footer-links" aria-label="Links institucionais">
          <a href="privacy.html">Política de Privacidade</a>
          <a href="terms.html">Termos de Uso</a>
          <a href="sobre.html">Contato</a>
        </nav>
        <p>Desenvolvido para fins demonstrativos.</p>
      </footer>
    </main>
  </div>

<script src="js/app.js"></script>
<script src="js/theme.js"></script>
<script src="js/search.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
